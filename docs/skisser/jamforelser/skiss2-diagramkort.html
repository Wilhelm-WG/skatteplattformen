<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skiss 2 · Diagramkortet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Inter:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA;--bg2:#EAE6DC;--bg3:#DEDAD0;--paper:#FBFAF6;
  --ink:#1A1813;--ink2:#4A4640;--ink3:#5C574F;
  --green:#1B4D3E;--green2:#2E7D5C;--green-l:#C8E6DA;--green-ll:#EAF4EE;
  --border:rgba(26,24,19,0.10);--border2:rgba(26,24,19,0.06);
  --shadow-sm:0 1px 2px rgba(26,24,19,.04),0 1px 3px rgba(26,24,19,.05);
  --shadow-md:0 2px 6px rgba(26,24,19,.05),0 8px 20px rgba(26,24,19,.06);
  --r:8px;--r-sm:5px;
  --fs-avsnitt:2.5rem;--fs-under:1.75rem;--fs-ingress:1.25rem;--fs-brod:1rem;--fs-liten:.8125rem;--fs-etikett:.6875rem;
  --k-soc:#6B4A9E;--k-vard:#1E7471;--k-utb:#1E4A8C;--k-infra:#B07B24;--k-forv:#5E5A54;--k-forsv:#34586E;
  --k-kommun:#B84A1E;--k-ratt:#7D2B3B;--k-eu:#4A87B5;--k-ovrigt:#8A857C;
  --d-neutral:#D2CBBE;--d-neutral2:#A39C8F;--d-mark:var(--green);
  --serif:'Source Serif 4',Georgia,serif;--sans:'Inter',-apple-system,system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1016px;margin:0 auto;padding:56px 24px 64px}
.skiss-bar{background:var(--ink);color:#F4F1EA;font:500 12px/1.4 var(--mono);padding:8px 24px;letter-spacing:.02em}
.s-eye{font:600 var(--fs-etikett)/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:10px;margin:0 0 14px}
.s-eye::before{content:"";width:22px;height:1.5px;background:var(--green)}
.s-title{font:600 var(--fs-avsnitt)/1.12 var(--serif);letter-spacing:-.01em;margin:0 0 14px;font-optical-sizing:auto}
.s-sub{font-size:1.05rem;color:var(--ink2);max-width:40rem;margin:0}
.etikett{font:600 var(--fs-etikett)/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.kort{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pk{width:22px;height:22px;flex:none}
.anm{position:relative}
.anm-tag{position:absolute;right:-6px;top:-10px;background:#FFF3C4;color:#5A4500;font:600 11px/1 var(--sans);padding:4px 7px;border-radius:3px;box-shadow:var(--shadow-sm);z-index:3;white-space:nowrap}
a{color:var(--green)}
@media(max-width:640px){
  .container{padding:36px 16px 48px}
  .s-title{font-size:1.75rem}
  .s-sub{font-size:.95rem}
  .anm-tag{right:0}
}

.flikar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.flik{display:inline-flex;align-items:center;gap:8px;font:500 .875rem/1 var(--sans);padding:9px 14px 9px 10px;border-radius:20px;border:1px solid var(--border);background:var(--paper);color:var(--ink2)}
.flik .pk{width:18px;height:18px}
.flik.on{background:var(--green);border-color:var(--green);color:#fff}
.flik.on .pk{color:#fff!important}
.flik small{font:500 11px var(--mono);opacity:.75}
.jk{padding:26px 28px 20px;margin-bottom:22px}
.jk-g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px}
.jk-q{font:600 1.75rem/1.15 var(--serif);margin:0 0 6px}
.jk-m{font-size:.8125rem;color:var(--ink3);margin:0 0 20px}
.jk-tal{font:600 3.4rem/1 var(--serif);color:var(--green);font-variant-numeric:tabular-nums}
.jk-tal span{font:500 1.1rem var(--sans);color:var(--ink3);margin-left:4px}
.jk-lede{font-size:1rem;color:var(--ink2);margin:10px 0 0;line-height:1.5;max-width:22rem}
.jk-lede b{color:var(--ink)}
.riktn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--border);border-radius:4px;padding:5px 8px}
.diag{position:relative}
.d-rad{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 4.6rem;gap:10px;align-items:center;height:30px}
.d-land{font-size:.8125rem;color:var(--ink2);text-align:right}
.d-rad.se .d-land,.d-rad.se .d-v{color:var(--ink);font-weight:600}
.d-rad.val .d-land,.d-rad.val .d-v{color:var(--ink);font-weight:600}
.d-spar{position:relative;height:100%}
.d-spar::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dotted rgba(26,24,19,.18)}
.d-pt{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--d-neutral2)}
.d-rad.se .d-pt{width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--green)}
.d-rad.val .d-pt{background:var(--paper);box-shadow:inset 0 0 0 3px var(--ink2);width:15px;height:15px;margin:-7.5px 0 0 -7.5px}
.d-bar{position:absolute;left:0;top:7px;bottom:7px;background:var(--d-neutral);border-radius:2px}
.d-rad.norden .d-bar{background:var(--d-neutral2)}
.d-rad.se .d-bar{background:var(--green)}
.d-v{font:500 .8125rem var(--mono);color:var(--ink2);text-align:right;white-space:nowrap}
.d-v.na{font:italic 400 .75rem var(--sans);color:var(--ink3)}
.d-ref{position:absolute;top:-22px;bottom:0;border-left:2px dashed var(--ink2);pointer-events:none}
.d-ref span{position:absolute;top:0;left:6px;font:500 11px/1.2 var(--sans);color:var(--ink2);white-space:nowrap;background:var(--paper);padding-right:4px}
.d-ref.vanster span{left:auto;right:6px;padding:0 0 0 4px}
.d-axel{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 4.6rem;gap:10px;margin-top:4px}
.d-axel div{position:relative;height:16px;border-top:1px solid var(--border)}
.d-axel i{position:absolute;top:3px;transform:translateX(-50%);font:400 11px var(--mono);color:#66615A;font-style:normal}
.diag-top{height:24px}
.jmf-val{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border2)}
.jmf-val .etikett{margin-right:4px}
.chip{font:500 .8125rem/1 var(--sans);padding:7px 11px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--ink2)}
.chip.on{border-color:var(--ink2);background:var(--bg2);color:var(--ink)}
.jamfor-txt{font-size:.875rem;color:var(--ink2);margin:10px 0 0}
.jamfor-txt b{color:var(--ink)}
.jk-fot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--border2);font:400 .75rem/1.5 var(--mono);color:var(--ink3)}
.jk-fot a{color:var(--green)}
.om{font:500 .8125rem var(--sans);color:var(--green);text-decoration:underline;text-underline-offset:3px}
.pris{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;background:var(--bg2);border-radius:var(--r-sm);text-decoration:none;color:var(--ink)}
.pris .lapp{font:600 1.35rem/1 var(--serif);white-space:nowrap}
.pris .lapp small{font:500 .8125rem var(--sans);color:var(--ink3)}
.pris-t{font-size:.8125rem;color:var(--ink2);line-height:1.4}
.pris-t b{display:block;color:var(--ink);font-weight:600;font-size:.875rem}
.pris .pil{margin-left:auto;font:500 .8125rem var(--sans);color:var(--green);white-space:nowrap}
.sortera{display:inline-flex;border:1px solid var(--border);border-radius:16px;overflow:hidden;font:500 .75rem/1 var(--sans)}
.sortera span{padding:6px 10px;color:var(--ink2)}
.sortera span.on{background:var(--bg2);color:var(--ink)}
.diag-h{display:flex;justify-content:flex-end;margin-bottom:6px}
@media(max-width:640px){
  .jk{padding:20px 16px 16px}
  .jk-g{grid-template-columns:1fr;gap:18px}
  .jk-q{font-size:1.4rem}
  .jk-tal{font-size:2.6rem}
  .d-rad,.d-axel{grid-template-columns:4.4rem minmax(0,1fr) 4rem;gap:8px}
  .flikar{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 18px;padding:0 16px}
  .flik{flex:none}
  .pris{flex-wrap:wrap}
  .pris .pil{margin-left:0}
}

const tal = (v, ch, d) => { d = d ?? ch.dec ?? 0; return v.toLocaleString('sv-SE',{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/\s/g,' '); };
const pk = (n, c) => `<svg class="pk" style="color:${c};fill:currentColor" aria-hidden="true"><use href="#pk-${n}"/></svg>`;
const FL = [['sjukvard','vard','var(--k-vard)','Sjukvård'],['utbildning','utb','var(--k-utb)','Utbildning'],['socialt','soc','var(--k-soc)','Socialt skydd'],['samhalle','ratt','var(--k-ratt)','Samhälle'],['miljo','miljo','var(--k-ovrigt)','Klimat och energi']];

function diagram(ch, o){
  // o.typ: 'punkt' (axel som inte börjar på noll) | 'stapel'; o.val = index för valt land
  const rader = ch.v.map((v,i) => ({v,i})).sort((a,b) => (b.v ?? -1e9) - (a.v ?? -1e9));
  const vals = ch.v.filter(v => v !== null);
  let lo = 0, hi = Math.max(...vals, ch.ref.v) * 1.06, ticks;
  if(o.typ === 'punkt'){ lo = Math.floor(Math.min(...vals, ch.ref.v)) - 1; hi = Math.ceil(Math.max(...vals, ch.ref.v)) + 1; ticks = []; for(let t = lo; t <= hi; t++) if(t % 2 === 0) ticks.push(t); }
  else ticks = innerWidth <= 640 ? o.ticks.filter((t,i) => i % 2 === 0) : o.ticks;
  const x = v => ((v - lo) / (hi - lo) * 100).toFixed(1);
  const refX = +x(ch.ref.v);
  let h = `<div class="diag"><div class="diag-top"></div>`;
  rader.forEach(({v,i}) => {
    const cl = i === 0 ? ' se' : i === o.val ? ' val' : i <= 4 ? ' norden' : '';
    h += `<div class="d-rad${cl}"><span class="d-land">${JMF_LAND[i]}</span><span class="d-spar">`;
    if(v !== null) h += o.typ === 'punkt' ? `<i class="d-pt" style="left:${x(v)}%"></i>` : `<i class="d-bar" style="width:${x(v)}%"></i>`;
    h += `</span><span class="d-v${v === null ? ' na' : ''}">${v === null ? 'saknas' : tal(v,ch) + (ch.unit || '').replace(' ',' ')}</span></div>`;
  });
  h += `<div class="d-axel"><span></span><div>${ticks.map(t => `<i style="left:${x(t)}%">${t.toLocaleString('sv-SE').replace(/\s/g,' ')}</i>`).join('')}</div><span></span></div>`;
  // referenslinje över staplarna
  h += `<div style="position:absolute;inset:24px 0 20px 0;display:grid;grid-template-columns:var(--kol);gap:var(--gap);pointer-events:none"><span></span><span style="position:relative"><span class="d-ref${refX > 62 ? ' vanster' : ''}" style="left:${refX}%"><span>${ch.ref.lbl} ${tal(ch.ref.v,ch)}</span></span></span><span></span></div>`;
  return h + `</div>`;
}
